services:
- type: web
  name: webhook-github-action
  runtime: node
  plan: starter
  envVars:
  - key: GITHUB_OWNER_NAME
    sync: false
  - key: GITHUB_REPO_NAME
    sync: false
  - key: GITHUB_WORKFLOW_ID
    sync: false
  - key: RENDER_WEBHOOK_SECRET
    sync: false
  - key: RENDER_API_KEY
    sync: false
  - key: RENDER_SOURCE_SERVICE_ID
    sync: false
  - key: RENDER_TARGET_SERVICE_ID
    sync: false
  - key: GITHUB_WORKFLOW_REF
    value: main
  - key: GITHUB_API_TOKEN
    sync: false
  region: oregon
  buildCommand: pnpm install && pnpm run build
  startCommand: pnpm run start
