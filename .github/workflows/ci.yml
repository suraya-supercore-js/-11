name: Webhook receiver checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One CI run per PR branch; cancel superseded runs while edits are arriving.
concurrency:
  group: webhook-receiver-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test

      - name: Build VPS deployment image
        run: docker build -t suraya-render-webhook:ci .
      - name: Validate VPS Compose configuration
        env:
          RENDER_WEBHOOK_SECRET: ci-only-webhook-secret
          RENDER_API_KEY: ci-only-render-token
          RENDER_SOURCE_SERVICE_ID: srv-source123
          RENDER_TARGET_SERVICE_ID: srv-target456
          GITHUB_API_TOKEN: ci-only-github-token
          GITHUB_OWNER_NAME: example-owner
          GITHUB_REPO_NAME: example-repo
          GITHUB_WORKFLOW_ID: deploy.yml
        run: docker compose config --quiet
